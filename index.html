<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3ef">
<title>卡比獸夥伴入住前驗證</title>
<style>

:root{--ink:#24495a;--teal:#69a9b8;--cream:#fffdf8;--green:#eff9e7}
*{box-sizing:border-box}
html,body{margin:0;width:100%;overflow-x:hidden}
body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,#fbfaf5 0%,#edf4f1 72%,#fff 100%);
}
main{width:min(92vw,430px);margin:0 auto;padding:28px 0 38px}

/* quiz */
.head{text-align:center;margin-bottom:16px}
.snorlax{width:94px;height:94px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 8px}
h1{font-size:23px;margin:0;font-weight:850}
.card{background:#fffdf8;border:1px solid #d8e3df;border-radius:23px;padding:19px;margin:13px 0;box-shadow:0 8px 22px rgba(36,73,90,.07)}
.qtitle{font-size:18px;font-weight:800;margin-bottom:11px}
label{display:flex;gap:11px;align-items:center;padding:9px 7px;font-size:17px;border-radius:12px}
label:has(input:checked){background:#e7f0ec}
input{appearance:none;width:23px;height:23px;border:2px solid #31768a;border-radius:6px;background:#fff;display:grid;place-content:center;margin:0}
input:checked:after{content:"✓";font-size:18px;font-weight:900;color:#31768a}
button{width:82%;display:block;margin:18px auto 8px;padding:14px;border:0;border-radius:999px;background:#31768a;color:#fff;font-size:18px;font-weight:800}
.msg{text-align:center;color:#916c5d;font-size:14px;min-height:22px}
.hidden{display:none!important}

/* final 9:16 composition */
.result-screen{
  height:100svh;
  width:100%;
  padding:6.5svh 0 2svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
}
.unlock{
  width:100%;
  flex:0 0 auto;
  text-align:center;
  background:rgba(239,249,231,.96);
  border:1px solid #d4e8c6;
  border-radius:25px;
  padding:1.55svh 12px;
  margin:0 0 2.1svh;
}
.unlock b{display:block;font-size:21px;color:#2d6c5c;margin-bottom:3px}
.pass{
  position:relative;
  width:100%;
  flex:0 0 auto;
  background:#fffdf8;
  border:3px solid var(--teal);
  border-radius:23px;
  padding:0 15px 13px;
  text-align:left;
  box-shadow:0 10px 24px rgba(36,73,90,.10);
  overflow:visible;
}
.pass:before,.pass:after{
  content:"";position:absolute;top:29%;width:27px;height:44px;
  background:#edf4f1;border:3px solid var(--teal);border-radius:50%;
}
.pass:before{left:-17px}
.pass:after{right:-17px}
.pass-title{
  margin:0 -15px 11px;
  padding:12px 15px 11px;
  border-bottom:1px solid #d8e4e4;
  text-align:center;
  font-size:18px;
  font-weight:900;
  white-space:nowrap;
}
.row{
  display:grid;
  grid-template-columns:68px minmax(0,1fr);
  align-items:center;
  gap:7px;
  margin:7px 0;
  font-size:16px;
}
.key{font-weight:900}
.roommate{display:flex;align-items:center;gap:8px}
.mini{width:31px;height:31px;object-fit:cover;border-radius:50%}
.location{font-size:13.5px;white-space:nowrap;letter-spacing:-.8px}

/* Sleeping Snorlax: complete, centered, reference-like */
.sleep-wrap{
  width:100%;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:1.2svh 0 0;
  overflow:hidden;
}
.sleeping-snorlax{
  display:block;
  width:78%;
  max-width:335px;
  height:auto;
  max-height:23svh;
  object-fit:contain;
  margin:0 auto;
}
.closing{
  flex:0 0 auto;
  width:100%;
  text-align:center;
  font-size:18px;
  font-weight:800;
  margin:.6svh 0 1svh;
}

@media(max-width:390px){
  main{width:91vw}
  .result-screen{padding-top:5.2svh}
  .unlock b{font-size:20px}
  .pass-title{font-size:17px}
  .row{grid-template-columns:62px minmax(0,1fr);font-size:15px}
  .location{font-size:12px;letter-spacing:-.8px}
  .sleeping-snorlax{width:74%;max-height:21svh}
  .closing{font-size:17px}
}
@media(max-height:720px){
  .result-screen{padding-top:3svh}
  .unlock{padding:1svh 10px;margin-bottom:1.2svh}
  .pass{padding-bottom:9px}
  .pass-title{padding-top:9px;padding-bottom:8px;margin-bottom:7px}
  .row{margin:5px 0}
  .sleeping-snorlax{max-height:18svh}
}

</style>
</head>
<body>
<main>
<section id="quiz">
 <div class="head">
   <img src="snorlax_icon.png" class="snorlax" alt="卡比獸">
   <h1>🔐 夥伴入住前驗證</h1>
 </div>

 <div class="card">
   <div class="qtitle">① 什麼時候可以出現？</div>
   <label><input type="checkbox">09/06–09/08</label>
   <label><input type="checkbox">想來就來</label>
   <label><input type="checkbox">想回家就出現 👌</label>
 </div>

 <div class="card">
   <div class="qtitle">② 入住要帶什麼？</div>
   <label><input type="checkbox">換洗衣物</label>
   <label><input type="checkbox">室友本人</label>
   <label><input type="checkbox">泡澡用具 🛁</label>
 </div>

 <button id="confirm">確認</button>
 <div id="msg" class="msg"></div>
</section>

<section id="result" class="hidden result-screen">
 <div class="unlock">
   <b>🔓 驗證成功！</b>
   卡比獸夥伴入住通行證已解鎖 ♡
 </div>

 <div class="pass">
   <div class="pass-title">🎫 卡比獸夥伴入住通行證</div>
   <div class="row"><div class="key">室友｜</div><div class="roommate">陳繪璇 <img src="snorlax_icon.png" class="mini" alt="卡比獸"></div></div>
   <div class="row"><div class="key">日期｜</div><div>09/06–09/08</div></div>
   <div class="row"><div class="key">地點｜</div><div class="location">臺北市大同區延平北路三段4號6樓</div></div>
   <div class="row"><div class="key">房號｜</div><div>入住當日解鎖 🔒</div></div>
 </div>

 <div class="sleep-wrap">
   <img src="snorlax_sleeping.png" class="sleeping-snorlax" alt="睡覺的卡比獸">
 </div>
 <div class="closing">想回家，就出現吧 😌</div>
</section>
</main>

<script>
const boxes=[...document.querySelectorAll('input[type=checkbox]')];
document.getElementById('confirm').onclick=()=>{
 const missing=boxes.filter(x=>!x.checked).length;
 if(missing){
   document.getElementById('msg').textContent=`還有 ${missing} 個正確答案沒勾選 👀`;
   if(navigator.vibrate) navigator.vibrate(70);
   return;
 }
 document.getElementById('quiz').classList.add('hidden');
 document.getElementById('result').classList.remove('hidden');
 window.scrollTo({top:0,behavior:'smooth'});
};
</script>
</body>
</html>

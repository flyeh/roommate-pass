<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3ef">
<title>卡比獸夥伴入住前驗證</title>
<style>
:root{--ink:#24495a;--teal:#31768a;--cream:#fffdf7;--line:#d9e3df}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
 color:var(--ink);background:linear-gradient(#f6f5ee,#dfeceb);
}
main{width:min(92vw,430px);margin:auto;padding:28px 0 42px}
.head{text-align:center;margin-bottom:18px}
.snorlax{width:104px;height:104px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 8px}
h1{font-size:24px;margin:0;font-weight:850}
.card{background:rgba(255,253,247,.96);border:1px solid var(--line);border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 10px 26px rgba(36,73,90,.08)}
.qtitle{font-size:18px;font-weight:800;margin-bottom:12px}
label{display:flex;gap:11px;align-items:center;padding:9px 7px;font-size:17px;border-radius:12px}
label:has(input:checked){background:#e7f0ec}
input{appearance:none;width:23px;height:23px;border:2px solid var(--teal);border-radius:6px;background:white;display:grid;place-content:center;margin:0}
input:checked:after{content:"✓";font-weight:900;font-size:18px;color:var(--teal)}
button{width:82%;display:block;margin:19px auto 8px;padding:14px;border:0;border-radius:999px;background:var(--teal);color:white;font-size:18px;font-weight:800;box-shadow:0 8px 18px rgba(36,73,90,.17)}
.msg{text-align:center;color:#916c5d;font-size:14px;min-height:22px}
.hidden{display:none!important}
.unlock{text-align:center;background:#edf7e4;border:1px solid #d2e5c4;border-radius:22px;padding:18px;margin-bottom:16px;animation:pop .4s ease}
.unlock b{font-size:22px;display:block;color:#2d6c5c;margin-bottom:5px}
.pass{background:var(--cream);border:3px solid #72adba;border-radius:24px;padding:18px;box-shadow:0 12px 28px rgba(36,73,90,.12);animation:pop .5s ease}
.pass-title{text-align:center;font-size:19px;font-weight:850;margin-bottom:17px}
.roommate{display:flex;align-items:center;gap:7px}
.mini{width:28px;height:28px;object-fit:cover;border-radius:50%}
.row{display:grid;grid-template-columns:58px minmax(0,1fr);gap:5px;align-items:center;margin:11px 0;font-size:16px}
.key{font-weight:800}
.location{font-size:11px;white-space:nowrap;letter-spacing:-.35px}
.closing{text-align:center;font-size:18px;font-weight:750;margin-top:23px}
@keyframes pop{from{opacity:0;transform:translateY(9px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:360px){.location{font-size:9.7px}.row{grid-template-columns:54px 1fr}.pass{padding:16px 13px}}
</style>
</head>
<body>
<main>
<section id="quiz">
 <div class="head">
   <img src="snorlax_icon.png" class="snorlax" alt="卡比獸">
   <h1>🔐 夥伴入住前驗證</h1>
 </div>

 <div class="card">
   <div class="qtitle">① 什麼時候可以出現？</div>
   <label><input type="checkbox">09/06–09/08</label>
   <label><input type="checkbox">想來就來</label>
   <label><input type="checkbox">想回家就出現 👌</label>
 </div>

 <div class="card">
   <div class="qtitle">② 入住要帶什麼？</div>
   <label><input type="checkbox">換洗衣物</label>
   <label><input type="checkbox">室友本人</label>
   <label><input type="checkbox">泡澡用具 🛁</label>
 </div>

 <button id="confirm">確認</button>
 <div id="msg" class="msg"></div>
</section>

<section id="result" class="hidden">
 <div class="unlock">
   <b>🔓 驗證成功！</b>
   卡比獸夥伴入住通行證已解鎖 ♡
 </div>

 <div class="pass">
   <div class="pass-title">🎫 卡比獸夥伴入住通行證</div>
   <div class="row"><div class="key">室友｜</div><div class="roommate">陳繪璇 <img src="snorlax_icon.png" class="mini" alt="卡比獸"></div></div>
   <div class="row"><div class="key">日期｜</div><div>09/06–09/08</div></div>
   <div class="row"><div class="key">地點｜</div><div class="location">臺北市大同區延平北路三段4號6樓</div></div>
   <div class="row"><div class="key">房號｜</div><div>入住當日解鎖 🔒</div></div>
 </div>

 <div class="closing">想回家，就出現吧 😌</div>
</section>
</main>

<script>
const boxes=[...document.querySelectorAll('input[type=checkbox]')];
document.getElementById('confirm').onclick=()=>{
 const missing=boxes.filter(x=>!x.checked).length;
 if(missing){
   document.getElementById('msg').textContent=`還有 ${missing} 個正確答案沒勾選 👀`;
   if(navigator.vibrate) navigator.vibrate(70);
   return;
 }
 document.getElementById('quiz').classList.add('hidden');
 document.getElementById('result').classList.remove('hidden');
 window.scrollTo({top:0,behavior:'smooth'});
};
</script>
</body>
</html>
